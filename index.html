<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alpha contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contact-container">
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">
            <div class="contact-left-title">
                <h2>get in touch</h2>
                <hr>
            </div>
            <input type="hidden" name="access_key" value="7bbefc4c-0d26-4722-affa-a6bb8a98a163">
            <input type="text" name="name" placeholder="your name" class="contact-input" required>
            <input type="email" name="message" id="emailbox" placeholder="youremail@gmail.com" class="contact-input" required>
            <textarea name="message" placeholder="your message" class="contact-inputs" required></textarea>
            <button type="submit" class="contact-input">submit <img src="right-arrow-alt-regular-24.png" alt=""></button>
        </form>
    </div>
</body>
</html>
